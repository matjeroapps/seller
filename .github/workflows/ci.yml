name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Seller owns no persistence and its tests run against a local stub Core
    # server, so no PostgreSQL service is required. Business correctness is
    # Core's responsibility and is tested there against a real database.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find apps cmd internal -name '*.go'))
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      # GOWORK=off proves the repository builds without the local development
      # workspace, which is what a fresh clone and a Docker build do.
      - run: GOWORK=off go mod tidy
      - name: no uncommitted go.mod/go.sum changes after tidy
        run: git diff --exit-code -- go.mod go.sum
      - run: GOWORK=off go build ./...
      - name: build seller-api
        run: GOWORK=off go build -o /dev/null ./apps/seller-api
      - name: build storefront-api
        run: GOWORK=off go build -o /dev/null ./apps/storefront-api
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test ./...

  # Repository Independence guard (ADR-017). Fails if a contributor reintroduces
  # a compile-time dependency on another Matjero repository. Only build-bearing
  # files are scanned, so documentation that names another service is fine.
  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: no other Matjero Go module
        run: |
          modules=$(GOWORK=off go list -m all | grep '^github.com/matjeroapps/' | grep -v '^github.com/matjeroapps/seller$' || true)
          if [ -n "$modules" ]; then
            echo "Repository Independence Rule violated. Other Matjero modules:"
            echo "$modules"
            exit 1
          fi
      - name: no Matjero imports in Go sources
        run: |
          matches=$(grep -rn 'github.com/matjeroapps/\(core\|admin\|supplier\|seller-hub\|supplier-hub\)' \
            --include='*.go' apps cmd internal || true)
          if [ -n "$matches" ]; then
            echo "Repository Independence Rule violated. Cross-repo imports:"
            echo "$matches"
            exit 1
          fi
      - name: no go.work committed
        run: |
          if [ -f go.work ] || [ -f go.work.sum ]; then
            echo "go.work must never be committed"
            exit 1
          fi
      - name: no replace directives
        run: |
          if grep -q '^replace ' go.mod; then
            echo "go.mod must not contain replace directives"
            exit 1
          fi

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: GOWORK=off go run ./cmd/openapi-gen
      - name: stale spec check
        run: git diff --exit-code -- docs/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build --workspaces --if-present

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: GOWORK=off go list -m all
      - run: npm audit --audit-level=high
      # gitleaks-action v3 requires a paid license for organization accounts;
      # the CLI is MIT-licensed and needs none.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks scan
        run: gitleaks detect --source . --redact --no-banner --verbose

  e2e:
    runs-on: ubuntu-latest
    # Seller owns no database and its E2E tests run against a local fake Core HTTP server
    # (ADR-017). Redis is provided as a CI service container for storefront caching.
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --entrypoint redis-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run E2E Test Suite
        run: ./scripts/run-e2e.sh
      - name: Upload Playwright Test Artifacts
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
